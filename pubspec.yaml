name: nfc_filament
description: "Application Flutter pour lire/écrire les puces NFC des bobines de filament"
publish_to: 'none'

version: 1.4.5+79

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_tracking_transparency: ^2.0.6+1
  cupertino_icons: ^1.0.9
  dartz: ^0.10.1
  device_info_plus: ^11.3.0
  equatable: ^2.0.5
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  google_mobile_ads: ^8.0.0
  google_sign_in: ^7.2.0
  hive_flutter: ^1.1.0
  http: ^1.2.2
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11+1
  in_app_review: ^2.0.10
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  nfc_manager: ^4.2.1
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
